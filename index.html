<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>نظام أوامر العمل | نسخة تجريبية</title>

<style>

:root{
--bg:#f4f7fb;
--card:#fff;
--ink:#162235;
--muted:#6b778c;
--primary:#155eef;
--line:#e6ebf2;
--ok:#0f9d6e;
--warn:#d98b00;
--danger:#d64545;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
font-family:Tahoma,Arial,sans-serif;
color:var(--ink);
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

.top{
height:68px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
position:sticky;
top:0;
z-index:10;
}

.brand{
display:flex;
gap:12px;
align-items:center;
font-weight:800;
}

.logo{
width:40px;
height:40px;
border-radius:12px;
background:var(--primary);
color:#fff;
display:grid;
place-items:center;
}

.user{
color:var(--muted);
font-size:13px;
}

.layout{
display:flex;
min-height:calc(100vh - 68px);
}

.side{
width:245px;
background:#111b2d;
color:#dfe7f5;
padding:22px 14px;
}

.side h4{
margin:0 10px 18px;
color:#fff;
}

.nav{
padding:12px 14px;
border-radius:10px;
margin:5px 0;
display:block;
color:#cdd7e8;
cursor:pointer;
}

.nav.active,
.nav:hover{
background:#203253;
color:#fff;
}

.main{
flex:1;
padding:28px;
max-width:1250px;
margin:auto;
width:100%;
}

.hero{
background:linear-gradient(135deg,#155eef,#254a9d);
color:#fff;
border-radius:20px;
padding:26px;
display:flex;
justify-content:space-between;
gap:20px;
align-items:center;
margin-bottom:22px;
}

.hero h1{
margin:0 0 8px;
font-size:26px;
}

.hero p{
margin:0;
color:#dfe9ff;
}

.hero .pill{
background:rgba(255,255,255,.15);
padding:10px 14px;
border-radius:12px;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.stat,
.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:18px;
}

.stat b{
font-size:27px;
}

.stat small{
display:block;
color:var(--muted);
margin-top:5px;
}

.section{
margin-top:20px;
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
gap:10px;
}

.section-title h2{
font-size:18px;
margin:0;
}

.btn{
border:0;
border-radius:10px;
padding:11px 16px;
background:var(--primary);
color:#fff;
font-weight:700;
}

.btn.secondary{
background:#edf3ff;
color:#155eef;
}

.btn.danger{
background:#fff0f0;
color:#c33;
}

.btn.success{
background:#e6f8f1;
color:#087957;
}

.btn.warning{
background:#fff5db;
color:#9a6500;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

.table-wrap{
border:1px solid var(--line);
border-radius:16px;
overflow:auto;
}

th,
td{
padding:13px 12px;
border-bottom:1px solid var(--line);
text-align:right;
font-size:13px;
white-space:nowrap;
}

th{
color:var(--muted);
background:#fafbfd;
}

.badge{
display:inline-block;
padding:6px 9px;
border-radius:999px;
font-size:11px;
font-weight:700;
}

.b-blue{
background:#eaf1ff;
color:#155eef;
}

.b-yellow{
background:#fff4cc;
color:#9a6500;
}

.b-green{
background:#e4f7ed;
color:#087957;
}

.b-gray{
background:#edf0f5;
color:#596579;
}

.b-red{
background:#ffe8e8;
color:#c62828;
}

.login{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
background:linear-gradient(135deg,#0f1d34,#155eef);
}

.login-card{
width:min(470px,100%);
background:#fff;
border-radius:24px;
padding:30px;

}

.login-card h1{
margin:0 0 7px;
}

.login-card p{
color:var(--muted);
margin-top:0;
}

.field{
margin:14px 0;
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
width:100%;
padding:12px;
border:1px solid #d9e0ea;
border-radius:10px;
background:#fff;
outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:var(--primary);
}

.field textarea{
min-height:100px;
resize:vertical;
}

.hint{
background:#f6f8fb;
border:1px solid var(--line);
border-radius:12px;
padding:12px;
font-size:12px;
color:var(--muted);
margin:14px 0;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.full{
grid-column:1/-1;
}

.preview{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
}

.preview img{
width:120px;
height:90px;
object-fit:cover;
border-radius:10px;
border:1px solid var(--line);
}

.modal-bg{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:20;
}

.modal{
background:#fff;
border-radius:18px;
padding:22px;
width:min(760px,100%);
max-height:90vh;
overflow:auto;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
}

.x{
border:0;
background:#eef2f7;
border-radius:9px;
padding:7px 11px;
font-size:20px;
}

.timeline{
border-right:3px solid #dbe5f8;
padding-right:15px;
}

.step{
margin:0 0 18px;
position:relative;
}

.step:before{
content:"";
position:absolute;
right:-23px;
top:2px;
width:12px;
height:12px;
background:#155eef;
border-radius:50%;
border:3px solid #fff;
}

.step small{
color:var(--muted);
}

.step b{
display:block;
margin:4px 0;
}

.notice{
padding:12px;
border-radius:12px;
background:#fff8e6;
color:#795900;
border:1px solid #f4df9e;
font-size:13px;
margin-bottom:15px;
}

.notice.success{
background:#eafaf3;
color:#087957;
border-color:#bcebd8;
}

.notice.danger{
background:#fff0f0;
color:#b42323;
border-color:#f3c0c0;
}

.signature-box{
margin-top:15px;
}

#signaturePad{
width:100%;
height:250px;
border:2px dashed #ccd5e2;
border-radius:12px;
background:#fff;
touch-action:none;
display:block;
}

.status-card{
border:1px solid var(--line);
border-radius:14px;
padding:15px;
margin:12px 0;
}

.status-flow{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
}

.arrow{
color:#9aa6b8;
font-weight:bold;
}

.signature-image{
max-width:300px;
width:100%;
border:1px solid #ddd;
border-radius:10px;
background:#fff;
margin-top:10px;
}

@media(max-width:900px){

.side{
display:none;

.grid{
grid-template-columns:repeat(2,1fr);

.form-grid{
grid-template-columns:1fr;
}

.hero{
flex-direction:column;
align-items:flex-start;

}

@media(max-width:600px){

.top{
padding:0 12px;
}

.user{

}

.main{

}

.stat{

.stat b{
font-size:22px;
}

th,
td{

</style>
</head>


<body>

<div id="app"></div>

<div class="modal-bg" id="modal">

<script>

/* =========================================================

========================================================= */

const cats=[

/* =========================================================

const mockUsers={

"1001":{

},

},

areas:["العناية المركزة"],
password:"1234567"

},

"01":{

name:"سامي أحمد فرحة",
dept:"مدير إدارة الصيانة العامة",
areas:depts,
admin:true,
password:"12345678"

},

"02":{

name:"مشعل سلطان البلادي",
dept:"نائب مدير إدارة الصيانة العامة",
areas:depts,

password:"123456789"

},

"51572478":{

name:"محمد سعيد الشهري",
dept:"مدير إدارة التجهيزات",
areas:[
"الأشعة",
"العناية المركزة",
"المناظير",
"العيادات الخارجية",
"المختبر",
"الصيدلية",
"التنويم"
],
password:"1234567890"

},

"03":{

name:"محمد طاهر مقبل",
dept:"مساعد المشرف العام للشؤون الهندسية",
areas:[
"الأشعة",
"العناية المركزة",
"المناظير",
"العيادات الخارجية",
"المختبر",
"الصيدلية",
"التنويم"
],
password:"1122334455"

},


/* =====================================================
حساب ضابط الاتصال
===================================================== */

"04":{

name:"ضابط الاتصال",
dept:"ضابط الاتصال",
areas:depts,
officer:true,
password:"123456"

}

};


/* =========================================================
حالة النظام
========================================================= */

let state={

user:null,

tickets:JSON.parse(
localStorage.getItem("tickets") || "[]"
)

};


/* =========================================================
متغيرات التوقيع
========================================================= */

let signatureCanvas=null;
let signatureCtx=null;
let drawing=false;


/* =========================================================

========================================================= */

function save(){

localStorage.setItem(
"tickets",
JSON.stringify(state.tickets)
);

}


/* =========================================================
تشغيل التطبيق
========================================================= */

function app(){

if(!state.user){

login();

return;

}

shell();

dashboard();

}


/* =========================================================
تسجيل الدخول
========================================================= */

function login(){

document.getElementById("app").innerHTML=`

<div class="login">

<div class="login-card">

<div class="logo">
⚙
</div>

<h1>
نظام أوامر العمل
</h1>

<p>

</p>


<div class="field">

<label>
الرقم الوظيفي
</label>

<input
id="emp"
inputmode="numeric"
placeholder="أدخل الرقم الوظيفي"
onkeydown="if(event.key==='Enter') doLogin()"
>

</div>


<div class="field">

<label>
الرقم السري
</label>

<input
id="pw"
type="password"
placeholder="أدخل الرقم السري"
onkeydown="if(event.key==='Enter') doLogin()"
>

</div>

class="btn"
style="width:100%"

>

<b>للتجربة:</b>

<br><br>

<br>

<br>
الرقم السري: 12345

<br><br>

<br>

<br>
الرقم السري: 123456

</div>

</div>

</div>

`;

}


/* =========================================================
التحقق من تسجيل الدخول
========================================================= */

function doLogin(){

let id=document
.getElementById("emp")
.value
.trim();

let pw=document
.getElementById("pw")
.value;


if(!id){

alert("يرجى إدخال الرقم الوظيفي");

return;

}


if(!pw){

alert("يرجى إدخال الرقم السري");

return;

}


let u=mockUsers[id];


if(!u){

alert("الرقم الوظيفي غير موجود");

return;

}


if(u.password!==pw){

alert("الرقم السري غير صحيح");

return;

}


state.user=u;

app();

}


/* =========================================================
الواجهة الرئيسية
========================================================= */

/* =========================================================
لوحة التحكم
========================================================= */

function dashboard(){

let myTickets=state.tickets.filter(
x=>x.reporter===state.user.name
);


let displayTickets=
state.user.officer || state.user.admin
?

:
myTickets;


document.getElementById("main").innerHTML=`

<div class="hero">

<div>

<h1>

</h1>

<p>

</p>

</div>


<div class="pill">
نسخة تجريبية MVP
</div>

</div>


<div class="grid">

<div class="stat">

<b>
${displayTickets.length}
</b>

<small>
إجمالي البلاغات
</small>

</div>


<div class="stat">

<b>
${
displayTickets.filter(
x=>x.status==="جديد"
).length
}
</b>

<small>
بلاغات جديدة
</small>

</div>


<div class="stat">

<b>
${
displayTickets.filter(
x=>x.status==="قيد العمل"
).length
}
</b>

<small>
قيد العمل
</small>

</div>


<div class="stat">

<b>
${
displayTickets.filter(
x=>x.status==="تم الانتهاء"
).length
}
</b>

<small>
تم الانتهاء
</small>

</div>

</div>


<div class="section">

<div class="section-title">

<h2>
آخر أوامر العمل
</h2>


<button
class="btn"
onclick="newTicket()"
>
+ رفع بلاغ
</button>

</div>


${
displayTickets.length
?
ticketTable(
displayTickets
.slice(-8)
.reverse()
)

`
<div class="card">

<p style="color:var(--muted)">
لا توجد بلاغات حتى الآن.
</p>

</div>
`
}

</div>

`;

}


/* =========================================================
جدول البلاغات العام
========================================================= */

function ticketTable(arr){

return `

<div class="table-wrap">

<table>

<tr>

<th>
رقم البلاغ
</th>

<th>
التصنيف
</th>

<th>
الموقع
</th>

<th>
الأولوية
</th>

<th>
الحالة
</th>

<th>

</th>

<th>
القسم المحال
</th>

<th>

</th>

</tr>


${
arr.map(x=>`

#${x.id}

</td>

}

/* =========================================================
الحالات والألوان
========================================================= */

function badge(s){

let c="b-gray";


if(s==="جديد"){

c="b-gray";

}

else if(s==="قيد العمل"){

c="b-yellow";

}

else if(s==="تم الانتهاء"){

c="b-green";

}

else if(s==="لم يتم الإنهاء"){

c="b-red";

}

else if(s==="مغلق"){

c="b-blue";

}

else if(s==="عاجل"){

c="b-yellow";

}

else if(s==="حرج"){

c="b-blue";

}


return `

<span class="badge ${c}">
${s}
</span>

`;

}

document.getElementById("main").innerHTML=`

/* =========================================================
الصور
========================================================= */

let fileData=[];


function previewFiles(){

let f=[

...document
.getElementById("photos")
.files

];


fileData=f;


document.getElementById("prev").innerHTML=

/* =========================================================
تهيئة التوقيع
========================================================= */

function initSignature(){

signatureCanvas=
document
.getElementById("signaturePad");


if(!signatureCanvas){

return;

}


signatureCtx=
signatureCanvas
.getContext("2d");


signatureCtx.lineWidth=3;

signatureCtx.lineCap="round";

signatureCtx.lineJoin="round";

signatureCtx.strokeStyle="#111";


signatureCanvas.addEventListener(
"pointerdown",
startSignature
);


signatureCanvas.addEventListener(
"pointermove",
drawSignature
);


signatureCanvas.addEventListener(
"pointerup",
stopSignature
);


signatureCanvas.addEventListener(
"pointerleave",
stopSignature
);


signatureCanvas.addEventListener(
"pointercancel",
stopSignature
);

}


/* =========================================================
تحديد مكان القلم
========================================================= */

function getPosition(e){

let rect=
signatureCanvas
.getBoundingClientRect();


return{

x:
(e.clientX-rect.left)
*
(
signatureCanvas.width/
rect.width
),


y:
(e.clientY-rect.top)
*
(
signatureCanvas.height/
rect.height
)

};

}


/* =========================================================
بداية التوقيع
========================================================= */

function startSignature(e){

drawing=true;


let p=
getPosition(e);


signatureCtx.beginPath();


signatureCtx.moveTo(
p.x,
p.y
);

}


/* =========================================================
رسم التوقيع
========================================================= */

function drawSignature(e){

if(!drawing){

return;

}


let p=
getPosition(e);


signatureCtx.lineTo(
p.x,
p.y
);


signatureCtx.stroke();

}


/* =========================================================
نهاية التوقيع
========================================================= */

function stopSignature(){

drawing=false;

}


/* =========================================================
مسح التوقيع
========================================================= */

function clearSignature(){

if(
!signatureCanvas ||
!signatureCtx
){

return;

}


signatureCtx.clearRect(
0,
0,
signatureCanvas.width,
signatureCanvas.height
);

}


/* =========================================================
حفظ التوقيع واعتماد الإغلاق
========================================================= */

function saveSignature(id){

let x=
state.tickets.find(
t=>t.id==id
);


if(!x){

alert("البلاغ غير موجود");

return;

}


if(!signatureCanvas){

alert(
"تعذر فتح لوحة التوقيع."
);

return;

}


let canvasData=
signatureCanvas
.toDataURL("image/png");


let blankCanvas=
document
.createElement("canvas");


blankCanvas.width=
signatureCanvas.width;


blankCanvas.height=
signatureCanvas.height;


let blankData=
blankCanvas
.toDataURL("image/png");


if(canvasData===blankData){

alert(
"يرجى التوقيع أولاً."
);

return;

}


x.signature=
canvasData;


x.signatureDate=
new Date()
.toLocaleString("ar-SA");


x.signatureBy=
x.reporter;


x.status="مغلق";


save();


alert(
"تمت المصادقة على أمر العمل وإغلاقه بنجاح."
);


closeModal();


tickets();

}

function openModal(x){

document
.getElementById("modalBody")
.innerHTML=x;


document
.getElementById("modal")
.style.display="flex";

}


function closeModal(){

document
.getElementById("modal")
.style.display="none";


signatureCanvas=null;

signatureCtx=null;

drawing=false;

}


/* =========================================================
تسجيل الخروج
========================================================= */

function logout(){

state.user=null;

app();

}


/* =========================================================
إغلاق النافذة عند الضغط خارجها
========================================================= */

document
.getElementById("modal")
.addEventListener(
"click",
function(e){

if(e.target===this){

closeModal();

}

}
);

app();
